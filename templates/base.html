{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5c019b">
<title>{% block title %}Hera Creator Hub{% endblock %}</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="{% static 'img/icon-192.png' %}">
<link rel="apple-touch-icon" href="{% static 'img/icon-192.png' %}">
<link rel="stylesheet" href="{% static 'css/hera.css' %}">
<script src="{% static 'vendor/htmx.min.js' %}" defer></script>
<script src="{% static 'vendor/alpine.min.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
{% block body %}{% endblock %}
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {})); }
function heraCopy(btn, id) {
  const el = document.getElementById(id);
  // guarda o conteúdo do botão (pode ser só um ícone) e mostra o "copiado" por 1,5 s
  navigator.clipboard.writeText(el.innerText || el.textContent).then(() => { const t = btn.innerHTML; btn.innerHTML = btn.classList.contains('qicon') ? '✓' : 'Copiado ✓'; setTimeout(() => btn.innerHTML = t, 1500); });
}
// mensagem editada antes de enviar (23/11): ids em templates/gestao/_msg_edit.html
function heraEdit(p, n) {
  const g = k => document.getElementById(p + k + n), box = g('e');
  box.hidden = !box.hidden; g('m').hidden = !box.hidden;
  if (!box.hidden) box.querySelector('textarea').focus();
}
function heraEdited(p, n, reset) {
  const g = k => document.getElementById(p + k + n), ta = g('e').querySelector('textarea'), orig = g('o').value;
  if (reset) { ta.value = orig; g('w').innerHTML = ''; }
  const txt = ta.value, changed = txt.trim() !== orig.trim();
  g('t').value = txt; g('m').textContent = txt;
  g('e').querySelector('.qedit-why').hidden = !changed;
  if (g('k')) g('k').hidden = !changed;
  const a = g('l');
  if (a) {  // o WhatsApp abre com o texto editado; com grupo, o link não leva texto (a gestora copia)
    if (!a.dataset.href) a.dataset.href = a.getAttribute('href');
    const u = new URL(a.dataset.href, location.href);
    if (u.hostname === 'wa.me') a.href = u.origin + u.pathname + '?text=' + encodeURIComponent(txt);
    else { if (changed) u.searchParams.set('texto', txt); a.href = u.toString(); }
  }
}
</script>
</body>
</html>
