{% if q and results %}
<section class="card" style="border-color:var(--cyan)">
{% for it, answer in results %}
  <div style="padding:6px 0;{% if not forloop.first %}border-top:1px solid var(--border){% endif %}">
    <b>{{ it.question }}</b>
    <p style="margin:6px 0">{{ answer }}</p>
    {% if it.lesson %}<a class="pill" href="{% url 'lesson' it.lesson.pk %}">🎓 Ver aula</a>{% endif %}
    <div id="fb{{ it.pk }}" class="row" style="gap:6px;margin-top:6px"><small class="muted">Ajudou?</small>
      <button class="btn btn-sm" hx-post="{% url 'faq_feedback' it.pk %}" hx-vals='{"v":"1"}' hx-target="#fb{{ it.pk }}">👍</button>
      <button class="btn btn-sm" hx-post="{% url 'faq_feedback' it.pk %}" hx-vals='{"v":"0"}' hx-target="#fb{{ it.pk }}">👎</button></div>
  </div>
{% endfor %}
</section>
{% elif q and q|length >= 3 %}
<section class="card"><p style="margin:0">Não encontrei uma resposta para “{{ q }}”. Pergunte para a Hera aqui embaixo. 💜</p></section>
{% endif %}
